[workspace]
resolver = "2"
members = [
    "crates/orc-cli",
    "crates/orc-tui",
    "crates/orc-bridge",
    "crates/orc-config",
    "crates/orc-git",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bhh32/orc"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# TUI
crossterm = "0.28"
reedline = "0.38"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

# Filesystem
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }

# Syntax
syntect = "5"

# Misc
dirs = "6"

# Internal crates
orc-bridge = { path = "crates/orc-bridge" }
orc-tui = { path = "crates/orc-tui" }
orc-config = { path = "crates/orc-config" }
orc-git = { path = "crates/orc-git" }
